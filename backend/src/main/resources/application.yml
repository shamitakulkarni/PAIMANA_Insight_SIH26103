server:
  port: ${PORT:8081}

spring:
  application:
    name: paimana-insight

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:paimana}
    username: ${DB_USERNAME:paimana}
    password: ${DB_PASSWORD:paimana}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes}
    expiration-ms: 86400000

  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:8001}
